apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: snap2spoon
  namespace: snap2spoon
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - snap2spoon.example.com
        - api.snap2spoon.example.com
      secretName: snap2spoon-tls
  rules:
    - host: snap2spoon.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    - host: api.snap2spoon.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
