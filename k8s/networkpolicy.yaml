apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analyzer-only-from-api
  namespace: snap2spoon
spec:
  podSelector:
    matchLabels:
      app: analyzer
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 8001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-only-from-api
  namespace: snap2spoon
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 5432
