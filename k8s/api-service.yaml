apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: snap2spoon
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: snap2spoon
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels:
        app: api
      annotations:
        # Useful if you're using the OpenTelemetry Operator's auto-instrumentation
        # injection. Without it, the container already runs opentelemetry-instrument
        # itself, so auto-instrumentation works unmodified.
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      containers:
        - name: api
          image: snap2spoon/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: OTEL_SERVICE_NAME
              value: snap2spoon-api
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=snap2spoon,deployment.environment=$(ENV)"
            - name: ENV
              value: production
            - name: ANALYZER_URL
              valueFrom: { configMapKeyRef: { name: snap2spoon-config, key: ANALYZER_URL } }
            - name: CORS_ORIGINS
              valueFrom: { configMapKeyRef: { name: snap2spoon-config, key: CORS_ORIGINS } }
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom: { configMapKeyRef: { name: snap2spoon-config, key: OTEL_EXPORTER_OTLP_ENDPOINT } }
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              valueFrom: { configMapKeyRef: { name: snap2spoon-config, key: OTEL_EXPORTER_OTLP_PROTOCOL } }
            - name: OTEL_TRACES_EXPORTER
              valueFrom: { configMapKeyRef: { name: snap2spoon-config, key: OTEL_TRACES_EXPORTER } }
            - name: OTEL_METRICS_EXPORTER
              valueFrom: { configMapKeyRef: { name: snap2spoon-config, key: OTEL_METRICS_EXPORTER } }
            - name: OTEL_LOGS_EXPORTER
              valueFrom: { configMapKeyRef: { name: snap2spoon-config, key: OTEL_LOGS_EXPORTER } }
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: snap2spoon-config, key: POSTGRES_USER } }
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: snap2spoon-config, key: POSTGRES_DB } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: snap2spoon-secrets, key: POSTGRES_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: snap2spoon-secrets, key: JWT_SECRET } }
            - name: GOOGLE_CLIENT_ID
              valueFrom: { configMapKeyRef: { name: snap2spoon-config, key: GOOGLE_CLIENT_ID } }
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres.snap2spoon.svc:5432/$(POSTGRES_DB)"
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1,    memory: 1Gi }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: snap2spoon
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
