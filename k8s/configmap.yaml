apiVersion: v1
kind: ConfigMap
metadata:
  name: snap2spoon-config
  namespace: snap2spoon
data:
  ANALYZER_URL: "http://analyzer:8001"
  CORS_ORIGINS: "*"
  ANTHROPIC_MODEL: "claude-sonnet-4-6"
  # Google OAuth client ID is a public identifier. Keep it here (not in the
  # Secret). The api-service uses it as the expected token audience; the
  # frontend fetches it from /config to render the Sign-In button.
  GOOGLE_CLIENT_ID: "replace-me.apps.googleusercontent.com"
  # OpenTelemetry — disabled by default so you don't get connection errors
  # when no collector is installed. To enable: change exporters to "otlp",
  # and set OTEL_EXPORTER_OTLP_ENDPOINT to your collector URL.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_PROPAGATORS: "tracecontext,baggage"
  OTEL_TRACES_EXPORTER: "none"
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"
  POSTGRES_USER: "snap2spoon"
  POSTGRES_DB: "snap2spoon"
