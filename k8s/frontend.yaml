apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: snap2spoon
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: snap2spoon
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        instrumentation.opentelemetry.io/inject-nodejs: "true"
    spec:
      containers:
        - name: frontend
          image: snap2spoon/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: OTEL_SERVICE_NAME
              value: snap2spoon-frontend
            # Server-side fetches go here. Browser always hits /api on the
            # frontend origin (proxied via Next.js rewrites), so there's no
            # public API URL to configure.
            - name: API_URL_INTERNAL
              value: "http://api.snap2spoon.svc.cluster.local:8000"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom: { configMapKeyRef: { name: snap2spoon-config, key: OTEL_EXPORTER_OTLP_ENDPOINT } }
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              valueFrom: { configMapKeyRef: { name: snap2spoon-config, key: OTEL_EXPORTER_OTLP_PROTOCOL } }
            - name: OTEL_TRACES_EXPORTER
              valueFrom: { configMapKeyRef: { name: snap2spoon-config, key: OTEL_TRACES_EXPORTER } }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1,    memory: 1Gi }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: snap2spoon
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
