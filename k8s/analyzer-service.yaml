apiVersion: v1
kind: Service
metadata:
  name: analyzer
  namespace: snap2spoon
spec:
  selector:
    app: analyzer
  ports:
    - port: 8001
      targetPort: 8001
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyzer
  namespace: snap2spoon
  labels:
    app: analyzer
spec:
  replicas: 2
  selector:
    matchLabels: { app: analyzer }
  template:
    metadata:
      labels:
        app: analyzer
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      containers:
        - name: analyzer
          image: snap2spoon/analyzer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: OTEL_SERVICE_NAME
              value: snap2spoon-analyzer
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: snap2spoon-secrets, key: ANTHROPIC_API_KEY } }
            - name: ANTHROPIC_MODEL
              valueFrom: { configMapKeyRef: { name: snap2spoon-config, key: ANTHROPIC_MODEL } }
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom: { configMapKeyRef: { name: snap2spoon-config, key: OTEL_EXPORTER_OTLP_ENDPOINT } }
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              valueFrom: { configMapKeyRef: { name: snap2spoon-config, key: OTEL_EXPORTER_OTLP_PROTOCOL } }
            - name: OTEL_TRACES_EXPORTER
              valueFrom: { configMapKeyRef: { name: snap2spoon-config, key: OTEL_TRACES_EXPORTER } }
            - name: OTEL_METRICS_EXPORTER
              valueFrom: { configMapKeyRef: { name: snap2spoon-config, key: OTEL_METRICS_EXPORTER } }
            - name: OTEL_LOGS_EXPORTER
              valueFrom: { configMapKeyRef: { name: snap2spoon-config, key: OTEL_LOGS_EXPORTER } }
          volumeMounts:
            - name: scratch
              mountPath: /tmp/snap2spoon
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: 2,    memory: 2Gi }
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: analyzer
  namespace: snap2spoon
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: analyzer
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
