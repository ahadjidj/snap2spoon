# nip.io Ingress with a cert-manager-issued Let's Encrypt certificate.
#
# __LB_IP__ is substituted by k8s/tls/apply.sh. After substitution the
# hostname looks like: snap2spoon-1-2-3-4.nip.io (nip.io resolves it to
# 1.2.3.4 with no DNS config on your side).
#
# Single hostname: the frontend serves the UI at `/` and proxies `/api/*`
# to the api service via Next.js rewrites. Synthetic monitors can hit
# https://snap2spoon-<ip>.nip.io/api/health directly.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: snap2spoon
  namespace: snap2spoon
  annotations:
    # Start with staging to verify the flow works without hitting rate
    # limits. Flip to letsencrypt-prod once it works.
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - snap2spoon-__LB_IP__.nip.io
      secretName: snap2spoon-tls
  rules:
    - host: snap2spoon-__LB_IP__.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
